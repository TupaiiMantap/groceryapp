<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0F172A" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Glowing cart circle -->
  <circle cx="256" cy="256" r="180" fill="url(#grad)" opacity="0.15" />
  
  <!-- Grocery Cart & Shield Motif -->
  <g transform="translate(116, 126) scale(0.55)">
    <!-- Shield Background in Cart -->
    <path d="M256 30 L430 90 C430 250 256 390 256 420 C256 390 82 250 82 90 Z" fill="url(#shieldGrad)" opacity="0.25" stroke="#38BDF8" stroke-width="8" />
    
    <!-- Cart Lines -->
    <path d="M40 70 L110 70 L170 290 L390 290 L440 130 L130 130" fill="none" stroke="#F8FAFC" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Wheels -->
    <circle cx="190" cy="370" r="32" fill="#10B981" stroke="#F8FAFC" stroke-width="12" />
    <circle cx="370" cy="370" r="32" fill="#10B981" stroke="#F8FAFC" stroke-width="12" />
    <!-- Checkmark inside -->
    <path d="M200 230 L245 275 L330 180" fill="none" stroke="#34D399" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Small currency tag badge -->
  <rect x="310" y="90" width="130" height="60" rx="30" fill="#10B981" />
  <text x="375" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">Rp</text>
</svg>
